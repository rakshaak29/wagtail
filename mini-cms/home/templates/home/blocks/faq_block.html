<div class="faq-section">
    <div class="faq-header">
        <h2>{{ value.title }}</h2>
    </div>

    <div class="faq-list">
        {% for item in value.items %}
        <div class="faq-item">
            <h4>{{ item.question }}</h4>
            <p>{{ item.answer }}</p>
        </div>
        {% endfor %}
    </div>
</div>
