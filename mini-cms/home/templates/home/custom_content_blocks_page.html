{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<section class="custom-page-hero">
    <h1>✨ Custom Content Blocks</h1>
    <p>All your content blocks displayed beautifully on one page.</p>
</section>

<div class="custom-page-content">
    <!-- Iterate over the 'blocks' list we created in the view -->
    {% for block in blocks %}
        {% include_block block %}
    {% empty %}
        <p style="text-align: center; padding: 2rem;">No blocks found on the Home Page.</p>
    {% endfor %}
</div>

{% endblock %}
